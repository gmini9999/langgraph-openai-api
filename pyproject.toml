[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-openai-api"
version = "0.1.0"
description = "Serve LangGraph graphs as OpenAI-compatible APIs"
readme = {text = "Serve LangGraph graphs as OpenAI-compatible APIs", content-type = "text/plain"}
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "python-multipart>=0.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
openlang = "langgraph_openai_api.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_openai_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
